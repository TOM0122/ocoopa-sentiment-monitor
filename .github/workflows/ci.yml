name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: PYTHONPATH="$PWD/src" python -m unittest discover -s tests
      - name: Compile sources
        run: python -m compileall src tests
      - name: Run non-production doctor
        run: PYTHONPATH="$PWD/src" python -m ocoopa_monitor.cli doctor --json

